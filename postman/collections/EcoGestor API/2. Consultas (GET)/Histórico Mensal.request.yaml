$kind: http-request
description: Retorna dados agrupados por mês, usados nos gráficos históricos.
url: "{{baseUrl}}/api/relatorios/ambiental-mensal/historico"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Contém arrays de água, energia e resíduos', () => {
        const res = pm.response.json();
        pm.expect(res).to.have.property('agua');
        pm.expect(res).to.have.property('energia');
        pm.expect(res).to.have.property('residuos');
      });
    language: text/javascript
order: 6000

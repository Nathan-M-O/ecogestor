$kind: http-request
description: Deleta o registro criado na requisição anterior. Usa a variável aguaId capturada no POST. Retorna 204 No Content.
url: "{{baseUrl}}/api/agua/{{aguaId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 2000

$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: '{ "email": "stake@eco.com", "senha": "stk123" }'
scripts:
  - type: afterResponse
    code: "pm.test('Status 200 OK', () => pm.response.to.have.status(200));\r

      pm.test('Perfil stakeholder', () => {\r

      \  const res = pm.response.json();\r

      \  pm.expect(res.usuario.perfil).to.eql('stakeholder');\r

      \  pm.collectionVariables.set('tokenStakeholder', res.token);\r

      });"
    language: text/javascript
order: 4000
